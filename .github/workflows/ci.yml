name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r host/requirements.txt pytest
      - run: python -m pytest host/tests -v
        env:
          PYTHONPATH: host
