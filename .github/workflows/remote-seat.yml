name: Remote Seat (browser desktop)
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Session length, minutes (max 340)"
        default: "340"

permissions:
  contents: write

jobs:
  seat:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Install desktop stack
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q \
            xvfb openbox x11vnc novnc websockify mesa-utils supertuxkart \
            fonts-dejavu chromium-browser python3-evdev python3-websockets \
            pulseaudio

      - name: Download cloudflared
        run: |
          curl -sL -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared

      - name: Start virtual gamepad bridge (uinput)
        run: |
          sudo modprobe uinput
          sudo nohup python3 "$GITHUB_WORKSPACE/clients/web-touch/gamepad_bridge.py" \
            --port 6081 > /tmp/gamepad.log 2>&1 &
          sleep 2
          sudo cat /tmp/gamepad.log
          # joystick device должен появиться
          ls -l /dev/input/js* /dev/input/event* | tail -5

      - name: Start virtual desktop
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 2
          openbox &
          pulseaudio --start || true
          # SuperTuxKart (software GL)
          LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe supertuxkart \
            --screensize=1280x720 --fullscreen > /tmp/stk.log 2>&1 &
          # Chromium с GeForce NOW (вход по вашему аккаунту через VNC)
          LIBGL_ALWAYS_SOFTWARE=1 chromium-browser --no-sandbox --disable-gpu \
            --window-size=1280,720 --start-maximized \
            --user-data-dir=/tmp/chrome-profile \
            https://play.geforcenow.com > /tmp/chrome.log 2>&1 &
          sleep 5
          PASS=$(head -c 9 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 10)
          echo "VNC_PASS=$PASS" >> $GITHUB_ENV
          x11vnc -display :99 -forever -shared -passwd "$PASS" -rfbport 5900 -quiet &
          # web root: noVNC + наша страница с двумя режимами управления
          mkdir -p /tmp/web
          cp -r /usr/share/novnc/* /tmp/web/
          cp "$GITHUB_WORKSPACE/clients/web-touch/nimbus.html" /tmp/web/nimbus.html
          websockify --web /tmp/web 6080 localhost:5900 &
          sleep 2

      - name: Open tunnels and publish URLs
        run: |
          /tmp/cloudflared tunnel --url http://localhost:6080 --no-autoupdate > /tmp/cf1.log 2>&1 &
          /tmp/cloudflared tunnel --url http://localhost:6081 --no-autoupdate > /tmp/cf2.log 2>&1 &
          for i in $(seq 1 30); do
            URL1=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf1.log | head -1 || true)
            URL2=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf2.log | head -1 || true)
            [ -n "$URL1" ] && [ -n "$URL2" ] && break
            sleep 2
          done
          [ -z "$URL1" ] && { cat /tmp/cf1.log; exit 1; }
          [ -z "$URL2" ] && { cat /tmp/cf2.log; exit 1; }
          GPWS="wss://${URL2#https://}/"
          # URL-encode wss url for query param
          GPENC=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$GPWS")
          END=$(date -u -d "+${{ github.event.inputs.minutes }} minutes" +"%Y-%m-%d %H:%M UTC")
          mkdir -p /tmp/live && cd /tmp/live
          git init -q -b live
          cat > SESSION.md <<EOM
          # NimbusSeat Remote Seat — LIVE

          - **📱 Подключение (2 режима: клава/мышь + геймпад):**
            $URL1/nimbus.html?pw=$VNC_PASS&gp=$GPENC
          - **🖥 Классический noVNC (ПК):** $URL1/vnc.html?autoconnect=true&resize=scale
          - **Пароль VNC:** \`$VNC_PASS\`
          - На рабочем столе: SuperTuxKart + Chromium с GeForce NOW
          - Виртуальный геймпад: Xbox 360 (uinput), мост: $GPWS
          - Сессия завершится примерно: $END
          EOM
          git add SESSION.md
          git -c user.name=runner -c user.email=runner@local commit -qm "live session info"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" live:live

      - name: Keep session alive
        run: |
          echo "Session running for ${{ github.event.inputs.minutes }} minutes..."
          sleep $(( ${{ github.event.inputs.minutes }} * 60 ))
